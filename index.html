<!DOCTYPE html>
<html lang="en">
<head>

  <title>Index</title>
  <style>
    body {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      font-family: Arial, sans-serif;
      background-color: #f9f9f9;
    }
    a {
      font-size: 2.5em;
      margin: 20px;
      text-decoration: none;
      color: #333;
      border: 2px solid #333;
      padding: 20px 40px;

      opacity: 0.4;
      cursor: not-allowed;

      background-color: #333;
      color: #fff;
    }
  </style>
